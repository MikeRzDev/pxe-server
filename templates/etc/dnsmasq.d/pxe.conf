# Proxmox PXE boot server - on-demand. Toggle with: pxectl on|off
# This file is only active while dnsmasq is running, and dnsmasq is NOT
# enabled at boot. See /etc/systemd/system/pxe.target.

# DNS server OFF. We only want DHCP-proxy + TFTP here; do not answer DNS
# queries on the LAN and do not fight anything on port 53.
port=0

# Only ever listen on the wired LAN interface.
interface=@@IFACE@@
bind-interfaces

# Verbose DHCP logging - essential for diagnosing PXE handshakes.
# Watch with: journalctl -u dnsmasq -f
log-dhcp

# PROXY-DHCP mode: the router keeps issuing all IP addresses and leases.
# dnsmasq only adds the "here is your boot file" information on top.
# Nothing on the LAN changes for non-PXE clients.
dhcp-range=@@LAN_NET@@,proxy

# TFTP - serves only the small iPXE binaries. The heavy files go over HTTP.
enable-tftp
tftp-root=/srv/pxe/tftp

# iPXE announces itself with DHCP option 175. Tag those clients so we can
# tell "bare firmware asking for a bootloader" apart from "iPXE already
# running and asking what to boot". Without this the client chainloads
# iPXE into iPXE into iPXE forever.
dhcp-match=set:ipxe,175

# --- Stage 1: bare firmware -> hand it the right iPXE build for its arch ---
pxe-service=tag:!ipxe,x86PC,"iPXE (BIOS)",undionly.kpxe
pxe-service=tag:!ipxe,X86-64_EFI,"iPXE (UEFI)",ipxe.efi

# --- Stage 2: iPXE is running -> hand it the boot script over HTTP ---
dhcp-boot=tag:ipxe,http://@@SERVER_IP@@/boot.ipxe
pxe-service=tag:ipxe,x86PC,"Proxmox VE installer",http://@@SERVER_IP@@/boot.ipxe
pxe-service=tag:ipxe,X86-64_EFI,"Proxmox VE installer",http://@@SERVER_IP@@/boot.ipxe
