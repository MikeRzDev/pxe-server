# DietPi mounts /var/log as a tmpfs (dietpi-ramlog), so /var/log/nginx is wiped
# on every boot. nginx then fails its own `nginx -t` ExecStartPre with:
#   [emerg] open() "/var/log/nginx/error.log" failed (2: No such file or directory)
# This broke the PXE server after the first reboot following the 2026-07-30 build.
#
# Recreate the directory before the config test runs. ExecStartPre is a list and
# drop-ins append to it, so the list is reset first to control the ordering.
[Service]
ExecStartPre=
ExecStartPre=/usr/bin/install -d -o www-data -g adm -m 0755 /var/log/nginx
ExecStartPre=/usr/sbin/nginx -t -q -g 'daemon on; master_process on;'
